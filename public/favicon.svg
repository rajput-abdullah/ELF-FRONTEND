<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: app accent color #1e3a8a -->
  <rect width="32" height="32" rx="7" fill="#1e3a8a"/>

  <!-- Trailer / cargo box -->
  <rect x="2" y="9" width="17" height="13" rx="1.5" fill="white"/>

  <!-- Cab -->
  <path d="M19 12 L19 22 L28 22 L28 18 L25.5 12 Z" fill="white"/>

  <!-- Cab window -->
  <polygon points="21,13.5 24.5,13.5 26.5,17 21,17" fill="#1e3a8a"/>

  <!-- Rear wheel -->
  <circle cx="7" cy="24" r="2.5" fill="#1e3a8a" stroke="white" stroke-width="1.5"/>
  <circle cx="7" cy="24" r="1" fill="white"/>

  <!-- Front wheel -->
  <circle cx="22" cy="24" r="2.5" fill="#1e3a8a" stroke="white" stroke-width="1.5"/>
  <circle cx="22" cy="24" r="1" fill="white"/>

  <!-- ELD status indicator (green dot, top-right) -->
  <circle cx="27" cy="8" r="3" fill="#22c55e"/>
  <circle cx="27" cy="8" r="1.2" fill="white"/>
</svg>
